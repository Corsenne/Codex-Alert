<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ChatGPT Finish Alert</title><link rel="stylesheet" href="popup.css"></head>
<body>
<header><div class="mark" aria-hidden="true">✦</div><div><h1>FINISH ALERT</h1><p>Desktop Edition <span class="version">v1.1.2 Lite</span></p></div></header>
<main>
  <div id="unreadStatus" class="presence" role="status" aria-live="polite"><span class="presence-dot" aria-hidden="true"></span><strong id="unreadLabel">確認済み</strong></div>
  <label class="setting"><span><strong>回答完了通知</strong><small>バナーと通知音をまとめてON/OFF</small></span><input id="enabled" type="checkbox" aria-label="回答完了通知を有効にする"></label>
  <div class="sound-setting">
    <label class="sound-title" for="soundId">通知音</label>
    <div class="sound-row">
      <select id="soundId"><option value="holo">Hologram</option><option value="soft">Soft Chime</option><option value="pulse">Pulse</option><option value="female">女性</option></select>
      <button class="preview" id="previewSound" type="button" aria-label="選んだ通知音を試聴">▶ 試聴</button>
    </div>
    <div class="volume-row">
      <label for="soundVolume">音量</label>
      <input id="soundVolume" type="range" min="0" max="100" step="5" value="85" aria-label="通知音の音量">
      <output id="volumeValue" for="soundVolume">85%</output>
    </div>
  </div>
  <p class="feedback" id="feedback" aria-live="polite" hidden></p>
</main>
<script src="popup.js"></script>
</body></html>
