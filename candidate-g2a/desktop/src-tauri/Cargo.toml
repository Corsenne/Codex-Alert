[package]
name = "finish-alert-desktop"
version = "1.2.0"
description = "ChatGPT Finish Alert Windows companion"
authors = ["Corsenne"]
edition = "2021"

[lib]
name = "finish_alert_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = {version="2", features=[]}

[dependencies]
tauri = {version="2", features=["tray-icon"]}
tauri-plugin-single-instance = "2"
serde = {version="1",features=["derive"]}
serde_json = "1"
