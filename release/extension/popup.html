<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>ChatGPT Finish Alert</title><link rel="stylesheet" href="popup.css"></head>
<body>
<h1>Finish Alert <small>v1.2.0</small></h1>
<label class="toggle">通知を有効にする <input type="checkbox" id="enabled"></label>
<label>通知音
<select id="soundId"><option value="holo">Holo</option><option value="soft">Soft</option>
<option value="pulse">Pulse</option><option value="female">女性音声</option></select></label>
<label>音量 <span id="volumeValue"></span>
<input type="range" id="soundVolume" min="0" max="100" step="5"></label>
<button id="refresh">接続状態を更新</button><pre id="status" aria-live="polite"></pre>
<p id="feedback" role="alert"></p>
</body></html>
