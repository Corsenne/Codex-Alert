name: G3 Routing Source Tests
on:
  push:
    branches:
      - feature/codex-finish-alert-g0-g2
    paths:
      - "candidate-g3/**"
      - "tools/G3-Check-Codex-Link.ps1"
      - "tools/Verify-G3-Helper.ps1"
      - "G3-Check-Codex-Link.cmd"
      - "G3-Click-Test.cmd"
      - "tools/Run-G3-Click-Test.ps1"
      - ".github/workflows/g3-routing-tests.yml"
  pull_request:
    paths:
      - "candidate-g3/**"
      - "tools/G3-Check-Codex-Link.ps1"
      - "tools/Verify-G3-Helper.ps1"
      - "G3-Check-Codex-Link.cmd"
      - "G3-Click-Test.cmd"
      - "tools/Run-G3-Click-Test.ps1"
      - ".github/workflows/g3-routing-tests.yml"
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test G3 source
        run: |
          node --test candidate-g3/routing.test.mjs
          node candidate-g3/chrome-extension/tests/exact-route.cjs
          node --test candidate-g3/isolated-desktop/tests/g3-click-contract.test.mjs

  windows-routing:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run G3 click contract with Windows path/newline conventions
        shell: pwsh
        run: |
          node --test candidate-g3/isolated-desktop/tests/g3-click-contract.test.mjs
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Parse interactive G3 Codex link helper with Windows PowerShell 5.1
        shell: powershell
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools\Verify-G3-Helper.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Parse isolated G3 click sender and launcher with Windows PowerShell 5.1
        shell: powershell
        run: |
          $check = @("tools/Run-G3-Click-Test.ps1", "candidate-g3/scripts/Send-G3.ps1")
          foreach ($path in $check) {
            $tokens = $null
            $errorsFound = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errorsFound)
            if (@($errorsFound).Count -gt 0) {
              Write-Host "G3_CLICK_POWERSHELL_PARSE_HOLD"
              exit 1
            }
          }
          Write-Host "G3_CLICK_POWERSHELL_PARSE_PASS"
      - name: Test G3 PowerShell Stop link mapping
        shell: powershell
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests\Test-G3-Stop-Link.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Test native G3 Codex link validator (Windows Rust)
        shell: pwsh
        run: |
          rustc --edition=2021 --test candidate-g3/desktop/src-tauri/src/g3_routing.rs -o "$env:RUNNER_TEMP\g3-routing-tests.exe"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & "$env:RUNNER_TEMP\g3-routing-tests.exe"
          if ($LASTEXITCODE -ne 0) { exit 1 }
