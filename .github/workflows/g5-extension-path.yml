name: G5 Extension Directory Path Guard
on:
  push:
    branches: [feature/codex-finish-alert-g0-g2]
    paths:
      - 'release/Manage-Release.ps1'
      - 'release/tests/Test-G5-Extension-Path.ps1'
      - '.github/workflows/g5-extension-path.yml'
  pull_request:
    paths:
      - 'release/Manage-Release.ps1'
      - 'release/tests/Test-G5-Extension-Path.ps1'
      - '.github/workflows/g5-extension-path.yml'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate extension path handling
        shell: powershell
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File release/tests/Test-G5-Extension-Path.ps1
          if($LASTEXITCODE -ne 0){throw 'G5_EXTENSION_PATH_GUARD_HOLD'}
