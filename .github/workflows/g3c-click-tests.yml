name: G3C Isolated Chrome Click Tests
on:
  push:
    branches: [feature/codex-finish-alert-g0-g2]
    paths:
      - 'candidate-g3c/**'
      - 'tools/G3C-*.ps1'
      - 'G3C-*.cmd'
      - '.github/workflows/g3c-click-tests.yml'
  pull_request:
    paths:
      - 'candidate-g3c/**'
      - 'tools/G3C-*.ps1'
      - 'G3C-*.cmd'
      - '.github/workflows/g3c-click-tests.yml'
permissions:
  contents: read
jobs:
  chrome-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Chrome test extension safety and callback model
        run: |
          node --test candidate-g3c/chrome-extension/tests/source-contract.test.mjs
          node candidate-g3c/chrome-extension/tests/callback-flow.cjs
  windows-bridge:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse G3C setup, start, clean and build scripts
        shell: powershell
        run: |
          $paths = @("tools/G3C-Build.ps1", "tools/G3C-Register.ps1", "tools/G3C-Start.ps1", "tools/G3C-Cleanup.ps1", "tools/G3C-CI-Desktop.ps1", "tools/G3C-Audit.ps1")
          foreach ($file in $paths) {
            $tokens = $null
            $err = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file,[ref]$tokens,[ref]$err)
            if (@($err).Count -gt 0) { throw "G3C_POWERSHELL_PARSE_HOLD" }
          }
          Write-Host 'G3C_POWERSHELL_PARSER_PASS'
      - name: Build and test isolated Native Messaging bridge
        shell: pwsh
        run: |
          cargo test --manifest-path candidate-g3c/native-host/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cargo build --manifest-path candidate-g3c/native-host/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Write-Host 'G3C_WINDOWS_BRIDGE_BUILD_PASS'

  windows-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build complete G3C isolated desktop with synthetic silent audio
        shell: powershell
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools\G3C-CI-Desktop.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }
