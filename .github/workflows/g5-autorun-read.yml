name: G5 Missing Autorun Safe Read
on:
  push:
    branches: [feature/codex-finish-alert-g0-g2]
    paths:
      - 'release/Manage-Release.ps1'
      - 'release/tests/Test-G5-Missing-Autorun.ps1'
      - '.github/workflows/g5-autorun-read.yml'
  pull_request:
    paths:
      - 'release/Manage-Release.ps1'
      - 'release/tests/Test-G5-Missing-Autorun.ps1'
      - '.github/workflows/g5-autorun-read.yml'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify absent Run entry is safe and read-only
        shell: powershell
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File release/tests/Test-G5-Missing-Autorun.ps1
          if($LASTEXITCODE -ne 0){throw 'G5_AUTORUN_READ_HOLD'}
