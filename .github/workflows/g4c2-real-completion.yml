name: G4C2 Isolated Real Completion Integration Tests
on:
  push:
    branches:
      - feature/codex-finish-alert-g0-g2
    paths:
      - 'candidate-g4c2/**'
      - 'tools/G4C2-*.ps1'
      - 'G4C2-*.cmd'
      - '.github/workflows/g4c2-real-completion.yml'
  pull_request:
    paths:
      - 'candidate-g4c2/**'
      - 'tools/G4C2-*.ps1'
      - 'G4C2-*.cmd'
      - '.github/workflows/g4c2-real-completion.yml'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static contracts and actual observer source equivalence
        run: node --test candidate-g4c2/tests/*.test.mjs
      - name: Native callback model with live COMPLETE messages
        run: node candidate-g4c2/tests/g4c2-completion-flow.cjs
      - name: Existing detection regressions (G2A pinned observer source)
        run: node candidate-g2a/chrome-extension/tests/content-regression.cjs
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse all G4C2 Windows PowerShell 5.1 operator scripts
        shell: powershell
        run: |
          foreach($f in @('tools/G4C2-Register.ps1','tools/G4C2-Start.ps1',
                           'tools/G4C2-Cleanup.ps1','tools/G4C2-Real-Use.ps1')){
            $tokens=$null;$errorsFound=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f,[ref]$tokens,[ref]$errorsFound)
            if(@($errorsFound).Count -gt 0){ throw ('G4C2_POWERSHELL_PARSE_HOLD '+$f) }
          }
          Write-Host 'G4C2_WINDOWS_POWERSHELL_PARSER_PASS'
      - name: Verify existing G4 isolated callback Rust tests remain stable
        shell: powershell
        run: |
          cargo test --manifest-path candidate-g4/native-host/Cargo.toml
          if($LASTEXITCODE -ne 0){throw 'G4C2_REUSED_NATIVE_BRIDGE_TEST_HOLD'}
          Write-Host 'G4C2_REUSED_NATIVE_BRIDGE_RUST_PASS'
